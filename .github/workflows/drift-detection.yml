name: Drift detection

on:
  schedule:
    # Hourly critical observation of the organization-level controls that gate
    # merges into protected main. Makes no per-repository call and installs no
    # Nix, Bazel, OpenTofu, or OPA.
    - cron: "41 * * * *"
    # One complete nightly diagnostic remains the canonical drift signal.
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-governance-drift
  cancel-in-progress: false

env:
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    accept-flake-config = false
    substituters = https://cache.nixos.org/
    trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
    require-sigs = true
  OPA_LINUX_AMD64_SHA256: 4814caaf89062b9929e7373c745eb1b73be8aa347be61da06491f68fe910245b
  OPA_VERSION: 1.20.1
  ROLLOUT_PHASE: ${{ vars.GHCFG_ROLLOUT_PHASE }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  critical:
    name: critical controls
    if: >-
      github.ref == 'refs/heads/main'
      && github.event.schedule == '41 * * * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Bind the runner identity before any third-party action
        env:
          APP_ID: ${{ vars.GHCFG_PLAN_APP_ID }}
          INSTALLATION_ID: ${{ vars.GHCFG_PLAN_APP_INSTALLATION_ID }}
          KEY_SECRET: ${{ vars.GHCFG_PLAN_APP_KEY_SECRET }}
          SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT_GITHUB_CONFIG_PLAN }}
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER_GITHUB_CONFIG_PLAN }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          [[ "${APP_ID}" =~ ^[0-9]+$ ]]
          [[ "${INSTALLATION_ID}" =~ ^[0-9]+$ ]]
          [[ -n "${KEY_SECRET}" && -n "${SERVICE_ACCOUNT}" && -n "${WIF_PROVIDER}" ]]

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6.0.0
        with:
          go-version-file: compiler/go.mod
          cache: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          audience: sts.googleapis.com
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER_GITHUB_CONFIG_PLAN }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_GITHUB_CONFIG_PLAN }}
          create_credentials_file: true
          export_environment_variables: true

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - id: app-key
        uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262 # v3.0.0
        with:
          secrets: |-
            private_key:${{ vars.GHCFG_PLAN_APP_KEY_SECRET }}

      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GHCFG_PLAN_APP_ID }}
          private-key: ${{ steps.app-key.outputs.private_key }}
          owner: mindclade
          # Critical scope makes no per-repository call, so the installation token
          # is narrowed to this repository; only the organization-level read
          # permissions below are actually exercised.
          repositories: |-
            github-config
          permission-administration: read
          permission-metadata: read
          permission-organization-administration: read

      - name: Observe and compare the critical controls
        id: critical
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          umask 077
          go -C compiler build -o "$RUNNER_TEMP/github-configctl" ./cmd/github-configctl
          "$RUNNER_TEMP/github-configctl" --root "$GITHUB_WORKSPACE" \
            compile --output "$RUNNER_TEMP/catalog.json"
          "$RUNNER_TEMP/github-configctl" --root "$GITHUB_WORKSPACE" \
            observe --organization mindclade --scope critical \
            --output "$RUNNER_TEMP/observed.json"
          status=0
          "$RUNNER_TEMP/github-configctl" --root "$GITHUB_WORKSPACE" \
            diff --desired "$RUNNER_TEMP/catalog.json" \
            --observed "$RUNNER_TEMP/observed.json" --scope critical \
            --output "$RUNNER_TEMP/critical-drift.json" || status=$?
          if [[ "$status" != "0" && "$status" != "2" ]]; then
            exit "$status"
          fi
          printf 'drift=%s\n' "$status" >> "$GITHUB_OUTPUT"

      - name: Fail on critical drift
        if: steps.critical.outputs.drift == '2'
        run: |
          echo "Critical governance controls drifted; the nightly full run has detail." >&2
          exit 1

  drift:
    name: observe and compare
    if: >-
      github.ref == 'refs/heads/main'
      && github.event.schedule != '41 * * * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Gate effective read identity before third-party actions
        id: pre-auth-contract-gate
        env:
          APPLY_APP_ID: ${{ vars.GHCFG_APPLY_APP_ID }}
          APPLY_APP_INSTALLATION_ID: ${{ vars.GHCFG_APPLY_APP_INSTALLATION_ID }}
          APPLY_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT_GITHUB_CONFIG_APPLY }}
          APPLY_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER_GITHUB_CONFIG_APPLY }}
          EXECUTOR_CONTRACT_EVIDENCE_DIGEST: ${{ vars.GHCFG_EXECUTOR_CONTRACT_EVIDENCE_DIGEST }}
          PLAN_APP_ID: ${{ vars.GHCFG_PLAN_APP_ID }}
          PLAN_APP_INSTALLATION_ID: ${{ vars.GHCFG_PLAN_APP_INSTALLATION_ID }}
          PLAN_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT_GITHUB_CONFIG_PLAN }}
          PLAN_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER_GITHUB_CONFIG_PLAN }}
          STATE_BACKEND_EVIDENCE_DIGEST: ${{ vars.GHCFG_STATE_BACKEND_EVIDENCE_DIGEST }}
          TF_STATE_BUCKET: ${{ vars.GHCFG_STATE_BUCKET }}
          TF_STATE_PREFIX: ${{ vars.GHCFG_STATE_PREFIX }}
          WIF_QUALIFICATION_EVIDENCE_DIGEST: ${{ vars.GHCFG_WIF_QUALIFICATION_EVIDENCE_DIGEST }}
          WIF_QUALIFICATION_EXPIRES_EPOCH: ${{ vars.GHCFG_WIF_QUALIFICATION_EXPIRES_EPOCH }}
          WIF_QUALIFIED_SOURCE_SHA: ${{ vars.GHCFG_WIF_QUALIFIED_SOURCE_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          test "$WIF_QUALIFIED_SOURCE_SHA" = "$GITHUB_SHA"
          [[ "$WIF_QUALIFICATION_EVIDENCE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$WIF_QUALIFICATION_EXPIRES_EPOCH" =~ ^[0-9]+$ ]]
          now_epoch="$(date -u +%s)"
          (( WIF_QUALIFICATION_EXPIRES_EPOCH > now_epoch ))
          (( WIF_QUALIFICATION_EXPIRES_EPOCH <= now_epoch + 604800 ))
          [[ "$PLAN_APP_ID" =~ ^[0-9]+$ && "$APPLY_APP_ID" =~ ^[0-9]+$ && "$PLAN_APP_ID" != "$APPLY_APP_ID" ]]
          [[ "$PLAN_APP_INSTALLATION_ID" =~ ^[0-9]+$ && "$APPLY_APP_INSTALLATION_ID" =~ ^[0-9]+$ && "$PLAN_APP_INSTALLATION_ID" != "$APPLY_APP_INSTALLATION_ID" ]]
          state_backend_digest="sha256:$(
            jq -S -n \
              --arg bucket "$TF_STATE_BUCKET" \
              --arg prefix "$TF_STATE_PREFIX" \
              '{version: "gcs-backend/v1", bucket: $bucket, prefix: $prefix}' \
              | sha256sum | cut -d' ' -f1
          )"
          executor_contract_digest="sha256:$(
            jq -S -n \
              --arg audience "sts.googleapis.com" \
              --arg plan_service_account "$PLAN_SERVICE_ACCOUNT" \
              --arg plan_wif_provider "$PLAN_WIF_PROVIDER" \
              --arg apply_service_account "$APPLY_SERVICE_ACCOUNT" \
              --arg apply_wif_provider "$APPLY_WIF_PROVIDER" \
              --argjson plan_app_id "$PLAN_APP_ID" \
              --argjson plan_installation_id "$PLAN_APP_INSTALLATION_ID" \
              --argjson apply_app_id "$APPLY_APP_ID" \
              --argjson apply_installation_id "$APPLY_APP_INSTALLATION_ID" '
                {
                  version: "github-config-executor/v1",
                  organization: "mindclade",
                  audience: $audience,
                  repositories: [".github", "bootstrap", "github-config", "gitops", "infrastructure-live", "mindclade"],
                  plan: {
                    app_id: $plan_app_id,
                    installation_id: $plan_installation_id,
                    service_account: $plan_service_account,
                    workload_identity_provider: $plan_wif_provider
                  },
                  apply: {
                    app_id: $apply_app_id,
                    installation_id: $apply_installation_id,
                    service_account: $apply_service_account,
                    workload_identity_provider: $apply_wif_provider
                  }
                }
              ' | sha256sum | cut -d' ' -f1
          )"
          test "$state_backend_digest" = "$STATE_BACKEND_EVIDENCE_DIGEST"
          test "$executor_contract_digest" = "$EXECUTOR_CONTRACT_EVIDENCE_DIGEST"

      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          determinate: false
          diagnostic-endpoint: ""
          github-token: ""
          kvm: false
          nix-package-url: https://releases.nixos.org/nix/nix-2.31.2/nix-2.31.2-x86_64-linux.tar.xz
          source-revision: 3477b9e591f27522d437d78b21cb857ce87dd6bb
          summarize: false
          trust-runner-user: false

      - name: Materialize locked Bazel toolchain
        shell: bash
        run: |
          set -euo pipefail
          nix config show --json | jq -e '
            def config_value:
              if type == "object" and has("value") then .value else . end;
            (.substituters | config_value) == ["https://cache.nixos.org/"] and
            (."trusted-public-keys" | config_value) ==
              ["cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY="] and
            (."require-sigs" | config_value) == true and
            (."accept-flake-config" | config_value) == false
          ' >/dev/null
          toolchain="$(nix build --no-accept-flake-config --no-link --no-update-lock-file --print-out-paths .#toolchain)"
          test -x "$toolchain/bin/bazel"
          printf '%s/bin\n' "$toolchain" >> "$GITHUB_PATH"

      - name: Configure OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false

      - name: Verify the bootstrap-qualified workflow identity
        id: identity-gate
        env:
          WIF_QUALIFICATION_EVIDENCE_DIGEST: ${{ vars.GHCFG_WIF_QUALIFICATION_EVIDENCE_DIGEST }}
          WIF_QUALIFICATION_EXPIRES_EPOCH: ${{ vars.GHCFG_WIF_QUALIFICATION_EXPIRES_EPOCH }}
          WIF_QUALIFIED_SOURCE_SHA: ${{ vars.GHCFG_WIF_QUALIFIED_SOURCE_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          current_epoch="$(date -u +%s)"
          maximum_expiry="$((current_epoch + 604800))"
          test "$WIF_QUALIFIED_SOURCE_SHA" = "$GITHUB_SHA"
          [[ "$WIF_QUALIFICATION_EVIDENCE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$WIF_QUALIFICATION_EXPIRES_EPOCH" =~ ^[0-9]+$ ]]
          (( WIF_QUALIFICATION_EXPIRES_EPOCH > current_epoch ))
          (( WIF_QUALIFICATION_EXPIRES_EPOCH <= maximum_expiry ))

      - name: Evaluate the exact catalog against policy
        id: policy-gate
        shell: bash
        run: |
          set -euo pipefail
          opa_path="$RUNNER_TEMP/opa"
          curl --fail --silent --show-error --location \
            "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64" \
            --output "$opa_path"
          printf '%s  %s\n' "$OPA_LINUX_AMD64_SHA256" "$opa_path" \
            | sha256sum --check --strict
          chmod 0755 "$opa_path"
          bazel run --config=ci //compiler:github-configctl -- \
            --root "$GITHUB_WORKSPACE" policy-input \
            --output "$RUNNER_TEMP/policy-input.json"
          "$opa_path" test policy policy/tests
          for package in \
            least_privilege \
            protected_rulesets \
            workflow_sources \
            oidc_subjects \
            environment_approvals; do
            "$opa_path" eval --fail --data policy \
              --input "$RUNNER_TEMP/policy-input.json" \
              "count(data.github_config.${package}.deny) == 0" > /dev/null
          done

      - name: Validate the effective read executor before authentication
        id: static-contract-gate
        env:
          APPLY_APP_ID: ${{ vars.GHCFG_APPLY_APP_ID }}
          APPLY_APP_INSTALLATION_ID: ${{ vars.GHCFG_APPLY_APP_INSTALLATION_ID }}
          APPLY_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT_GITHUB_CONFIG_APPLY }}
          APPLY_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER_GITHUB_CONFIG_APPLY }}
          EXECUTOR_CONTRACT_EVIDENCE_DIGEST: ${{ vars.GHCFG_EXECUTOR_CONTRACT_EVIDENCE_DIGEST }}
          PLAN_APP_ID: ${{ vars.GHCFG_PLAN_APP_ID }}
          PLAN_APP_INSTALLATION_ID: ${{ vars.GHCFG_PLAN_APP_INSTALLATION_ID }}
          PLAN_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT_GITHUB_CONFIG_PLAN }}
          PLAN_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER_GITHUB_CONFIG_PLAN }}
          STATE_BACKEND_EVIDENCE_DIGEST: ${{ vars.GHCFG_STATE_BACKEND_EVIDENCE_DIGEST }}
          TF_STATE_BUCKET: ${{ vars.GHCFG_STATE_BUCKET }}
          TF_STATE_PREFIX: ${{ vars.GHCFG_STATE_PREFIX }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PLAN_APP_ID" =~ ^[0-9]+$ && "$APPLY_APP_ID" =~ ^[0-9]+$ && "$PLAN_APP_ID" != "$APPLY_APP_ID" ]]
          [[ "$PLAN_APP_INSTALLATION_ID" =~ ^[0-9]+$ && "$APPLY_APP_INSTALLATION_ID" =~ ^[0-9]+$ && "$PLAN_APP_INSTALLATION_ID" != "$APPLY_APP_INSTALLATION_ID" ]]
          state_backend_digest="sha256:$(
            jq -S -n \
              --arg bucket "$TF_STATE_BUCKET" \
              --arg prefix "$TF_STATE_PREFIX" \
              '{version: "gcs-backend/v1", bucket: $bucket, prefix: $prefix}' \
              | sha256sum | cut -d' ' -f1
          )"
          executor_contract_digest="sha256:$(
            jq -S -n \
              --arg audience "sts.googleapis.com" \
              --arg plan_service_account "$PLAN_SERVICE_ACCOUNT" \
              --arg plan_wif_provider "$PLAN_WIF_PROVIDER" \
              --arg apply_service_account "$APPLY_SERVICE_ACCOUNT" \
              --arg apply_wif_provider "$APPLY_WIF_PROVIDER" \
              --argjson plan_app_id "$PLAN_APP_ID" \
              --argjson plan_installation_id "$PLAN_APP_INSTALLATION_ID" \
              --argjson apply_app_id "$APPLY_APP_ID" \
              --argjson apply_installation_id "$APPLY_APP_INSTALLATION_ID" '
                {
                  version: "github-config-executor/v1",
                  organization: "mindclade",
                  audience: $audience,
                  repositories: [".github", "bootstrap", "github-config", "gitops", "infrastructure-live", "mindclade"],
                  plan: {
                    app_id: $plan_app_id,
                    installation_id: $plan_installation_id,
                    service_account: $plan_service_account,
                    workload_identity_provider: $plan_wif_provider
                  },
                  apply: {
                    app_id: $apply_app_id,
                    installation_id: $apply_installation_id,
                    service_account: $apply_service_account,
                    workload_identity_provider: $apply_wif_provider
                  }
                }
              ' | sha256sum | cut -d' ' -f1
          )"
          test "$state_backend_digest" = "$STATE_BACKEND_EVIDENCE_DIGEST"
          test "$executor_contract_digest" = "$EXECUTOR_CONTRACT_EVIDENCE_DIGEST"

      - name: Authenticate the read-only cloud identity
        id: google-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          audience: sts.googleapis.com
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER_GITHUB_CONFIG_PLAN }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_GITHUB_CONFIG_PLAN }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Read the plan App key
        id: app-key
        uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262 # v3.0.0
        with:
          secrets: |-
            private_key:${{ vars.GHCFG_PLAN_APP_KEY_SECRET }}

      - name: Mint the plan App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GHCFG_PLAN_APP_ID }}
          private-key: ${{ steps.app-key.outputs.private_key }}
          owner: mindclade
          repositories: |-
            .github
            github-config
            bootstrap
            infrastructure-live
            gitops
            mindclade
          permission-administration: read
          permission-actions: read
          permission-contents: read
          permission-environments: read
          permission-members: read
          permission-metadata: read
          permission-organization-administration: read
          permission-organization-custom-org-roles: read
          permission-organization-custom-properties: read
          permission-organization-plan: read
          permission-organization-secrets: read
          permission-organization-self-hosted-runners: read
          permission-repository-custom-properties: read
          permission-secrets: read
          permission-security-events: read
          permission-vulnerability-alerts: read

      - name: Bind the reviewed executor and backend contracts
        id: contract-gate
        env:
          ACTUAL_PLAN_APP_INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
          APPLY_APP_ID: ${{ vars.GHCFG_APPLY_APP_ID }}
          APPLY_APP_INSTALLATION_ID: ${{ vars.GHCFG_APPLY_APP_INSTALLATION_ID }}
          APPLY_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT_GITHUB_CONFIG_APPLY }}
          APPLY_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER_GITHUB_CONFIG_APPLY }}
          EXECUTOR_CONTRACT_EVIDENCE_DIGEST: ${{ vars.GHCFG_EXECUTOR_CONTRACT_EVIDENCE_DIGEST }}
          PLAN_APP_ID: ${{ vars.GHCFG_PLAN_APP_ID }}
          PLAN_APP_INSTALLATION_ID: ${{ vars.GHCFG_PLAN_APP_INSTALLATION_ID }}
          PLAN_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT_GITHUB_CONFIG_PLAN }}
          PLAN_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER_GITHUB_CONFIG_PLAN }}
          STATE_BACKEND_EVIDENCE_DIGEST: ${{ vars.GHCFG_STATE_BACKEND_EVIDENCE_DIGEST }}
          TF_STATE_BUCKET: ${{ vars.GHCFG_STATE_BUCKET }}
          TF_STATE_PREFIX: ${{ vars.GHCFG_STATE_PREFIX }}
          WIF_QUALIFICATION_EVIDENCE_DIGEST: ${{ vars.GHCFG_WIF_QUALIFICATION_EVIDENCE_DIGEST }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PLAN_APP_ID" =~ ^[0-9]+$ && "$APPLY_APP_ID" =~ ^[0-9]+$ && "$PLAN_APP_ID" != "$APPLY_APP_ID" ]]
          [[ "$PLAN_APP_INSTALLATION_ID" =~ ^[0-9]+$ && "$APPLY_APP_INSTALLATION_ID" =~ ^[0-9]+$ && "$PLAN_APP_INSTALLATION_ID" != "$APPLY_APP_INSTALLATION_ID" ]]
          test "$ACTUAL_PLAN_APP_INSTALLATION_ID" = "$PLAN_APP_INSTALLATION_ID"
          state_backend_digest="sha256:$(
            jq -S -n \
              --arg bucket "$TF_STATE_BUCKET" \
              --arg prefix "$TF_STATE_PREFIX" \
              '{version: "gcs-backend/v1", bucket: $bucket, prefix: $prefix}' \
              | sha256sum | cut -d' ' -f1
          )"
          executor_contract_digest="sha256:$(
            jq -S -n \
              --arg audience "sts.googleapis.com" \
              --arg plan_service_account "$PLAN_SERVICE_ACCOUNT" \
              --arg plan_wif_provider "$PLAN_WIF_PROVIDER" \
              --arg apply_service_account "$APPLY_SERVICE_ACCOUNT" \
              --arg apply_wif_provider "$APPLY_WIF_PROVIDER" \
              --argjson plan_app_id "$PLAN_APP_ID" \
              --argjson plan_installation_id "$PLAN_APP_INSTALLATION_ID" \
              --argjson apply_app_id "$APPLY_APP_ID" \
              --argjson apply_installation_id "$APPLY_APP_INSTALLATION_ID" '
                {
                  version: "github-config-executor/v1",
                  organization: "mindclade",
                  audience: $audience,
                  repositories: [".github", "bootstrap", "github-config", "gitops", "infrastructure-live", "mindclade"],
                  plan: {
                    app_id: $plan_app_id,
                    installation_id: $plan_installation_id,
                    service_account: $plan_service_account,
                    workload_identity_provider: $plan_wif_provider
                  },
                  apply: {
                    app_id: $apply_app_id,
                    installation_id: $apply_installation_id,
                    service_account: $apply_service_account,
                    workload_identity_provider: $apply_wif_provider
                  }
                }
              ' | sha256sum | cut -d' ' -f1
          )"
          test "$state_backend_digest" = "$STATE_BACKEND_EVIDENCE_DIGEST"
          test "$executor_contract_digest" = "$EXECUTOR_CONTRACT_EVIDENCE_DIGEST"
          [[ "$WIF_QUALIFICATION_EVIDENCE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo "STATE_BACKEND_DIGEST=$state_backend_digest"
            echo "EXECUTOR_CONTRACT_DIGEST=$executor_contract_digest"
            echo "WIF_QUALIFICATION_EVIDENCE_DIGEST=$WIF_QUALIFICATION_EVIDENCE_DIGEST"
          } >> "$GITHUB_ENV"

      - name: Fetch and validate exact canonical workflow authorities
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          authority_root="$RUNNER_TEMP/canonical-workflow-authorities"
          test ! -e "$authority_root"
          install -d -m 0700 "$authority_root"
          bazel run --config=ci //compiler:github-configctl -- \
            compile --root "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/authority-catalog.json"
          while IFS=$'\t' read -r repository revision implementation_revision state; do
            if [[ "$state" != "reviewed" ]]; then
              continue
            fi
            [[ "$repository" =~ ^(\.github|bootstrap|infrastructure-live|gitops|mindclade)$ ]]
            [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
            if [[ "$repository" == ".github" ]]; then
              [[ "$implementation_revision" =~ ^[0-9a-f]{40}$ ]]
              [[ "$implementation_revision" != "$revision" ]]
            else
              [[ "$implementation_revision" == "-" ]]
            fi
            destination="$authority_root/$repository"
            gh repo clone "mindclade/$repository" "$destination" -- \
              --filter=blob:none --no-checkout
            git -C "$destination" fetch --no-tags origin \
              "+refs/heads/main:refs/remotes/origin/main"
            git -C "$destination" fetch --no-tags origin "$revision"
            git -C "$destination" merge-base --is-ancestor \
              "$revision" refs/remotes/origin/main
            if [[ "$implementation_revision" != "-" ]]; then
              git -C "$destination" fetch --no-tags origin "$implementation_revision"
              git -C "$destination" merge-base --is-ancestor \
                "$implementation_revision" "$revision"
              implementation_destination="$authority_root/.github-implementation"
              test ! -e "$implementation_destination"
              gh repo clone "mindclade/$repository" "$implementation_destination" -- \
                --filter=blob:none --no-checkout
              git -C "$implementation_destination" fetch --no-tags origin \
                "+refs/heads/main:refs/remotes/origin/main"
              git -C "$implementation_destination" fetch --no-tags origin \
                "$implementation_revision"
              git -C "$implementation_destination" merge-base --is-ancestor \
                "$implementation_revision" refs/remotes/origin/main
              git -C "$implementation_destination" checkout --detach "$implementation_revision"
              test "$(git -C "$implementation_destination" rev-parse HEAD)" = "$implementation_revision"
            fi
            git -C "$destination" checkout --detach "$revision"
            test "$(git -C "$destination" rev-parse HEAD)" = "$revision"
          done < <(
            jq -r '.actions_policy.authority_inventories[]
              | [.repository, .revision, (.implementation_revision // "-"), .activation.state] | @tsv' \
              "$RUNNER_TEMP/authority-catalog.json"
          )
          export MINDCLADE_AUTHORITY_ROOT="$authority_root"
          export MINDCLADE_REQUIRE_AUTHORITY_INVENTORIES=1
          bazel run --config=ci //compiler:github-configctl -- \
            validate --root "$GITHUB_WORKSPACE" > /dev/null
          {
            echo "MINDCLADE_AUTHORITY_ROOT=$authority_root"
            echo "MINDCLADE_REQUIRE_AUTHORITY_INVENTORIES=1"
          } >> "$GITHUB_ENV"

      - name: Compile and observe desired state
        id: observe
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          umask 077
          case "$ROLLOUT_PHASE" in
            foundation|enforce) ;;
            *)
              echo "GHCFG_ROLLOUT_PHASE must be foundation or enforce." >&2
              exit 1
              ;;
          esac
          bazel run --config=ci //compiler:github-configctl -- \
            compile --root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/catalog.json"
          bazel run --config=ci //compiler:github-configctl -- \
            observe --root "$GITHUB_WORKSPACE" --organization mindclade \
            --output "$RUNNER_TEMP/observed.json"
          set +e
          bazel run --config=ci //compiler:github-configctl -- \
            preflight --root "$GITHUB_WORKSPACE" --desired "$RUNNER_TEMP/catalog.json" \
            --observed "$RUNNER_TEMP/observed.json" --phase "$ROLLOUT_PHASE" \
            --output "$RUNNER_TEMP/preflight.json"
          preflight_status=$?
          set -e
          if [[ "$preflight_status" != "0" && "$preflight_status" != "2" ]]; then
            exit "$preflight_status"
          fi
          echo "preflight_exit=$preflight_status" >> "$GITHUB_ENV"
          bazel run --config=ci //compiler:github-configctl -- \
            diff --root "$GITHUB_WORKSPACE" --desired "$RUNNER_TEMP/catalog.json" \
            --observed "$RUNNER_TEMP/observed.json" \
            --output "$RUNNER_TEMP/github-drift.json" || status=$?
          status="${status:-0}"
          if [[ "$status" != "0" && "$status" != "2" ]]; then
            exit "$status"
          fi
          echo "github_diff_exit=$status" >> "$GITHUB_ENV"

          set +e
          bazel run --config=ci //compiler:github-configctl -- \
            doctor --root "$GITHUB_WORKSPACE" --organization mindclade \
            --observed "$RUNNER_TEMP/observed.json" \
            --authority-root "$MINDCLADE_AUTHORITY_ROOT" --require-authorities \
            --output "$RUNNER_TEMP/doctor.json" \
            --markdown-output "$RUNNER_TEMP/doctor.md"
          doctor_status=$?
          set -e
          if [[ "$doctor_status" != "0" && "$doctor_status" != "1" && "$doctor_status" != "2" ]]; then
            exit "$doctor_status"
          fi
          echo "doctor_exit=$doctor_status" >> "$GITHUB_ENV"

      - name: Produce the provider drift plan
        id: tofu-plan
        env:
          APPLY_APP_ID: ${{ vars.GHCFG_APPLY_APP_ID }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          PLAN_APP_ID: ${{ vars.GHCFG_PLAN_APP_ID }}
          TF_STATE_BUCKET: ${{ vars.GHCFG_STATE_BUCKET }}
          TF_STATE_PREFIX: ${{ vars.GHCFG_STATE_PREFIX }}
        run: |
          set -euo pipefail
          umask 077
          cp -R opentofu "$RUNNER_TEMP/opentofu"
          jq -n \
            --slurpfile catalog "$RUNNER_TEMP/catalog.json" \
            --slurpfile preflight "$RUNNER_TEMP/preflight.json" '
              {
                catalog: $catalog[0],
                adopted_environment_ids: ($preflight[0].adopted_environment_ids // {}),
                adopted_environment_policy_ids: ($preflight[0].adopted_environment_policy_ids // {}),
                adopted_memberships: ($preflight[0].adopted_memberships // {}),
                adopted_organization_custom_properties: ($preflight[0].adopted_organization_custom_properties // {}),
                adopted_organization_oidc_templates: ($preflight[0].adopted_organization_oidc_templates // {}),
                adopted_outside_collaborator_grants: ($preflight[0].adopted_outside_collaborator_grants // {}),
                adopted_repository_actions_access_levels: ($preflight[0].adopted_repository_actions_access_levels // {}),
                adopted_repository_custom_properties: ($preflight[0].adopted_repository_custom_properties // {}),
                adopted_repository_names: ($preflight[0].adopted_repository_names // {}),
                adopted_repository_oidc_templates: ($preflight[0].adopted_repository_oidc_templates // {}),
                adopted_repository_ruleset_ids: ($preflight[0].adopted_repository_ruleset_ids // {}),
                adopted_repository_ruleset_enforcements: ($preflight[0].adopted_repository_ruleset_enforcements // {}),
                adopted_ruleset_ids: ($preflight[0].adopted_ruleset_ids // {}),
                adopted_ruleset_enforcements: ($preflight[0].adopted_ruleset_enforcements // {}),
                adopted_security_manager_assignments: ($preflight[0].adopted_security_manager_assignments // {}),
                adopted_team_ids: ($preflight[0].adopted_team_ids // {}),
                adopted_team_memberships: ($preflight[0].adopted_team_memberships // {}),
                adopted_team_repository_grants: ($preflight[0].adopted_team_repository_grants // {}),
                qualified_integration_actor_ids: ($preflight[0].qualified_integration_actor_ids // {}),
                qualified_status_check_integration_ids: ($preflight[0].qualified_status_check_integration_ids // {})
              }
            ' > "$RUNNER_TEMP/catalog.auto.tfvars.json"
          cd "$RUNNER_TEMP/opentofu/live/organization"
          tofu init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="prefix=${TF_STATE_PREFIX}"
          set +e
          tofu plan -input=false -no-color -detailed-exitcode \
            -var="rollout_phase=${ROLLOUT_PHASE}" \
            -var-file="$RUNNER_TEMP/catalog.auto.tfvars.json" \
            -out="$RUNNER_TEMP/drift.tfplan" \
            > "$RUNNER_TEMP/tofu-drift.log"
          status=$?
          set -e
          if [[ "$status" == "1" ]]; then
            jq -n \
              --arg api_version "github.mindclade.io/v1" \
              --arg kind "ProviderDriftEvidence" \
              --arg source_sha "$GITHUB_SHA" \
              '{api_version: $api_version, kind: $kind, status: "operational_error", source_sha: $source_sha}' \
              > "$RUNNER_TEMP/drift-evidence.json"
            echo "exitcode=$status" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tofu show -json "$RUNNER_TEMP/drift.tfplan" > "$RUNNER_TEMP/plan.json"
          echo "exitcode=$status" >> "$GITHUB_OUTPUT"
          created_epoch="$(date -u +%s)"
          expires_epoch="$((created_epoch + 21600))"
          (
            cd "$GITHUB_WORKSPACE"
            bazel run --config=ci //compiler:github-configctl -- \
              evidence --root "$GITHUB_WORKSPACE" --catalog "$RUNNER_TEMP/catalog.json" \
              --observed "$RUNNER_TEMP/observed.json" \
              --plan "$RUNNER_TEMP/plan.json" --plan-file "$RUNNER_TEMP/drift.tfplan" \
              --phase "$ROLLOUT_PHASE" --organization mindclade \
              --change-reference "drift:${GITHUB_RUN_ID}" \
              --workflow-ref "$GITHUB_WORKFLOW_REF" --source-sha "$GITHUB_SHA" \
              --workflow-sha "$GITHUB_WORKFLOW_SHA" \
              --actor-id "$GITHUB_ACTOR_ID" --plan-app-id "$PLAN_APP_ID" \
              --apply-app-id "$APPLY_APP_ID" \
              --wif-qualification-evidence-digest "$WIF_QUALIFICATION_EVIDENCE_DIGEST" \
              --state-backend-digest "$STATE_BACKEND_DIGEST" \
              --executor-contract-digest "$EXECUTOR_CONTRACT_DIGEST" \
              --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --created-epoch "$created_epoch" --expires-epoch "$expires_epoch" \
              --output "$RUNNER_TEMP/drift-evidence.json"
            bazel run --config=ci //compiler:github-configctl -- \
              verify-evidence --root "$GITHUB_WORKSPACE" \
              --input "$RUNNER_TEMP/drift-evidence.json" > /dev/null
          )
          rm -f "$RUNNER_TEMP/drift.tfplan" "$RUNNER_TEMP/plan.json"

      - name: Produce terminal drift diagnostic
        id: terminal-diagnostic
        if: ${{ always() }}
        env:
          APP_KEY_OUTCOME: ${{ steps.app-key.outcome }}
          APP_TOKEN_OUTCOME: ${{ steps.app-token.outcome }}
          CONTRACT_GATE_OUTCOME: ${{ steps.contract-gate.outcome }}
          GITHUB_DIFF_EXIT: ${{ env.github_diff_exit }}
          DOCTOR_EXIT: ${{ env.doctor_exit }}
          GOOGLE_AUTH_OUTCOME: ${{ steps.google-auth.outcome }}
          IDENTITY_GATE_OUTCOME: ${{ steps.identity-gate.outcome }}
          OBSERVE_OUTCOME: ${{ steps.observe.outcome }}
          POLICY_GATE_OUTCOME: ${{ steps.policy-gate.outcome }}
          PRE_AUTH_CONTRACT_GATE_OUTCOME: ${{ steps.pre-auth-contract-gate.outcome }}
          PREFLIGHT_EXIT: ${{ env.preflight_exit }}
          PROVIDER_EXIT: ${{ steps.tofu-plan.outputs.exitcode }}
          PROVIDER_OUTCOME: ${{ steps.tofu-plan.outcome }}
          STATIC_CONTRACT_GATE_OUTCOME: ${{ steps.static-contract-gate.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          digest_file() {
            local path="$1"
            if [[ -f "$path" && ! -L "$path" ]]; then
              sha256sum "$path" | cut -d' ' -f1
            fi
          }
          catalog_digest="$(digest_file "$RUNNER_TEMP/catalog.json")"
          drift_digest="$(digest_file "$RUNNER_TEMP/github-drift.json")"
          doctor_digest="$(digest_file "$RUNNER_TEMP/doctor.json")"
          evidence_digest="$(digest_file "$RUNNER_TEMP/drift-evidence.json")"
          preflight_digest="$(digest_file "$RUNNER_TEMP/preflight.json")"
          status="clean"
          for outcome in \
            "$PRE_AUTH_CONTRACT_GATE_OUTCOME" "$IDENTITY_GATE_OUTCOME" "$POLICY_GATE_OUTCOME" \
            "$STATIC_CONTRACT_GATE_OUTCOME" "$GOOGLE_AUTH_OUTCOME" "$APP_KEY_OUTCOME" "$APP_TOKEN_OUTCOME" \
            "$CONTRACT_GATE_OUTCOME" "$OBSERVE_OUTCOME" "$PROVIDER_OUTCOME"; do
            if [[ "$outcome" == "failure" || "$outcome" == "cancelled" ]]; then
              status="operational_error"
            fi
          done
          if [[ "$PROVIDER_EXIT" == "1" ]]; then
            status="operational_error"
          elif [[ "$status" == "clean" ]] && \
            { [[ "$PREFLIGHT_EXIT" == "2" ]] || [[ "$GITHUB_DIFF_EXIT" == "2" ]] || [[ "$PROVIDER_EXIT" == "2" ]]; }; then
            status="drift"
          fi
          if [[ "$DOCTOR_EXIT" == "1" ]]; then
            status="operational_error"
          elif [[ "$status" == "clean" && "$DOCTOR_EXIT" == "2" ]]; then
            status="drift"
          fi
          jq -S -n \
            --arg api_version "github.mindclade.io/v1" \
            --arg kind "DriftRunDiagnostic" \
            --arg status "$status" \
            --arg source_sha "$GITHUB_SHA" \
            --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            --arg workflow_sha "$GITHUB_WORKFLOW_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg actor_id "$GITHUB_ACTOR_ID" \
            --arg pre_auth_contract_gate "$PRE_AUTH_CONTRACT_GATE_OUTCOME" \
            --arg identity_gate "$IDENTITY_GATE_OUTCOME" \
            --arg policy_gate "$POLICY_GATE_OUTCOME" \
            --arg static_contract_gate "$STATIC_CONTRACT_GATE_OUTCOME" \
            --arg google_auth "$GOOGLE_AUTH_OUTCOME" \
            --arg app_key "$APP_KEY_OUTCOME" \
            --arg app_token "$APP_TOKEN_OUTCOME" \
            --arg contract_gate "$CONTRACT_GATE_OUTCOME" \
            --arg observe "$OBSERVE_OUTCOME" \
            --arg provider "$PROVIDER_OUTCOME" \
            --arg preflight_exit "$PREFLIGHT_EXIT" \
            --arg github_diff_exit "$GITHUB_DIFF_EXIT" \
            --arg doctor_exit "$DOCTOR_EXIT" \
            --arg provider_exit "$PROVIDER_EXIT" \
            --arg catalog_digest "$catalog_digest" \
            --arg drift_digest "$drift_digest" \
            --arg doctor_digest "$doctor_digest" \
            --arg evidence_digest "$evidence_digest" \
            --arg preflight_digest "$preflight_digest" '
              {
                api_version: $api_version,
                kind: $kind,
                status: $status,
                authorization: "none",
                bindings: {
                  source_sha: $source_sha,
                  workflow_ref: $workflow_ref,
                  workflow_sha: $workflow_sha,
                  run_id: $run_id,
                  run_attempt: $run_attempt,
                  actor_id: $actor_id
                },
                outcomes: {
                  pre_auth_contract_gate: $pre_auth_contract_gate,
                  identity_gate: $identity_gate,
                  policy_gate: $policy_gate,
                  static_contract_gate: $static_contract_gate,
                  google_auth: $google_auth,
                  app_key: $app_key,
                  app_token: $app_token,
                  contract_gate: $contract_gate,
                  observe: $observe,
                  provider: $provider,
                  preflight_exit: $preflight_exit,
                  github_diff_exit: $github_diff_exit,
                  doctor_exit: $doctor_exit,
                  provider_exit: $provider_exit
                },
                digests: ({}
                  + (if $catalog_digest == "" then {} else {catalog: ("sha256:" + $catalog_digest)} end)
                  + (if $drift_digest == "" then {} else {github_drift: ("sha256:" + $drift_digest)} end)
                  + (if $doctor_digest == "" then {} else {doctor: ("sha256:" + $doctor_digest)} end)
                  + (if $evidence_digest == "" then {} else {drift_evidence: ("sha256:" + $evidence_digest)} end)
                  + (if $preflight_digest == "" then {} else {preflight: ("sha256:" + $preflight_digest)} end))
              }
            ' > "$RUNNER_TEMP/drift-run-diagnostic.base.json"
          diagnostic_digest="$(sha256sum "$RUNNER_TEMP/drift-run-diagnostic.base.json" | cut -d' ' -f1)"
          jq -S --arg digest "sha256:${diagnostic_digest}" \
            '. + {diagnostic_digest: $digest}' \
            "$RUNNER_TEMP/drift-run-diagnostic.base.json" \
            > "$RUNNER_TEMP/drift-run-diagnostic.json"
          rm -f "$RUNNER_TEMP/drift-run-diagnostic.base.json"

      - name: Upload redacted drift evidence
        if: ${{ always() && steps.pre-auth-contract-gate.outcome == 'success' && steps.identity-gate.outcome == 'success' && steps.policy-gate.outcome == 'success' && steps.static-contract-gate.outcome == 'success' && steps.google-auth.outcome == 'success' && steps.app-key.outcome == 'success' && steps.app-token.outcome == 'success' && steps.contract-gate.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-governance-drift-${{ github.sha }}
          path: |-
            ${{ runner.temp }}/drift-run-diagnostic.json
            ${{ runner.temp }}/github-drift.json
            ${{ runner.temp }}/doctor.json
            ${{ runner.temp }}/doctor.md
            ${{ runner.temp }}/drift-evidence.json
          if-no-files-found: error
          retention-days: 7

      - name: Fail on drift
        if: ${{ always() && (failure() || env.doctor_exit == '1' || env.doctor_exit == '2' || env.preflight_exit == '2' || steps.tofu-plan.outputs.exitcode == '1' || steps.tofu-plan.outputs.exitcode == '2' || env.github_diff_exit == '2') }}
        run: exit 2

  report:
    name: reconcile doctor issue
    needs: drift
    if: ${{ always() && needs.drift.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open, update, or close the canonical drift issue
        env:
          DRIFT_RESULT: ${{ needs.drift.result }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          marker="<!-- github-config-doctor-drift:v1 -->"
          title="GitHub governance drift detected"
          body_file="$RUNNER_TEMP/drift-issue.md"
          {
            echo "$marker"
            echo
            echo "Estate CI doctor found drift, incomplete observation, or an operational failure."
            echo
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Source: \`${GITHUB_SHA}\`"
            echo "- Result: \`${DRIFT_RESULT}\`"
            echo
            echo "Review the redacted evidence artifact. Do not repair settings manually; submit a catalog correction or use the protected recovery runbook."
          } > "$body_file"
          issue_number="$(gh api --method GET /search/issues \
            -f q="repo:${GITHUB_REPOSITORY} is:issue in:body \"github-config-doctor-drift:v1\"" \
            --jq '[.items[] | select(.body | contains("<!-- github-config-doctor-drift:v1 -->")) | .number] | sort | .[0] // empty')"
          if [[ "$DRIFT_RESULT" == "success" ]]; then
            if [[ -n "$issue_number" ]]; then
              issue_state="$(gh issue view "$issue_number" --json state --jq .state)"
              if [[ "$issue_state" == "OPEN" ]]; then
                gh issue close "$issue_number" --reason completed \
                  --comment "Recovered on ${GITHUB_SHA}; see ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
              fi
            fi
          elif [[ -n "$issue_number" ]]; then
            issue_state="$(gh issue view "$issue_number" --json state --jq .state)"
            if [[ "$issue_state" == "CLOSED" ]]; then
              gh issue reopen "$issue_number"
            fi
            gh issue edit "$issue_number" --title "$title" --body-file "$body_file"
          else
            gh issue create --title "$title" --body-file "$body_file"
          fi
