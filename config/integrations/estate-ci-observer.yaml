api_version: github.mindclade.io/v1
kind: Integration
metadata:
  id: estate-ci-observer
  owner_team: security
spec:
  type: github_app
  managed: false
  credential_authority: bootstrap
  plaintext_credentials_forbidden: true
  repository_selection: selected
  repositories: [.github, bootstrap, estate-ci, github-config, gitops, infrastructure-live, mindclade]
  permissions:
    - name: actions
      access: read
    - name: checks
      access: read
    - name: contents
      access: read
    - name: metadata
      access: read
  events: [workflow_run]
  qualification:
    state: blocked
    authority: bootstrap
  activation:
    state: blocked
    blockers: [github-app-installation-not-qualified, workload-identity-federation-not-qualified]
