api_version: github.mindclade.io/v1
kind: Environment
metadata:
  id: estate-health
  owner_team: platform-operations
spec:
  name: estate-health
  repositories: [.github]
  prevent_self_review: true
  can_admins_bypass: false
  required_reviewers:
    - type: team
      team: release-engineering
  approval_policy:
    minimum_required_reviewers: 1
    minimum_distinct_principals: 2
    require_pr_approval: true
    require_code_owner_review: true
    require_reviewer_different_from_pr_approver: true
  deployment_branch_policy:
    protected_branches: true
    custom_branch_policies: false
  allowed_workflows:
    - .github/workflows/estate-health.yml
    - .github/workflows/estate-ci-qualification.yml
  activation:
    state: blocked
    blockers:
      - workspace-groups-not-qualified
      - workload-identity-federation-not-qualified
      - github-app-installation-not-qualified
      - health-bucket-not-qualified
