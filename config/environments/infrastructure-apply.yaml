api_version: github.mindclade.io/v1
kind: Environment
metadata:
  id: infrastructure-apply
  owner_team: security
spec:
  name: infrastructure-apply
  repositories: [github-config, bootstrap, infrastructure-live]
  prevent_self_review: true
  can_admins_bypass: false
  required_reviewers:
    - type: team
      team: security
  approval_policy:
    minimum_required_reviewers: 1
    minimum_distinct_principals: 2
    require_pr_approval: true
    require_code_owner_review: true
    require_reviewer_different_from_pr_approver: true
  deployment_branch_policy:
    protected_branches: true
    custom_branch_policies: false
  allowed_workflows:
    - .github/workflows/protected-apply.yml
    - .github/workflows/disaster-recovery.yml
    - .github/workflows/recovery-verification.yml
  activation:
    state: blocked
    blockers:
      - independent-reviewer-required
      - protected-environment-not-qualified
      - ci-evidence-verifier-handoff-not-connected-qualified
      - infrastructure-export-verifier-handoff-not-connected-qualified
