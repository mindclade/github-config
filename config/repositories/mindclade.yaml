api_version: github.mindclade.io/v1
kind: Repository
metadata:
  id: mindclade
  owner_team: product-engineering
spec:
  name: mindclade
  description: Product source, contracts, immutable artifacts, and release packages.
  visibility: internal
  actions_access_level: none
  archived: false
  archive_on_destroy: true
  features:
    issues: true
    projects: false
    wiki: false
    discussions: false
    downloads: false
  merge_policy:
    allow_squash_merge: true
    allow_merge_commit: false
    allow_rebase_merge: false
    allow_auto_merge: true
    allow_update_branch: true
    delete_branch_on_merge: true
    squash_merge_commit_title: PR_TITLE
    squash_merge_commit_message: PR_BODY
  security:
    vulnerability_alerts: true
    dependabot_security_updates: true
    advanced_security: true
    secret_scanning: true
    secret_scanning_push_protection: true
  custom_properties:
    repository_class: application-source
    owner_team: product-engineering
    criticality: critical
    data_classification: restricted
    lifecycle: active
    ci_profile: buildkite
    language_profile: polyglot
    production_authority: signed-artifacts
  team_grants:
    - team: product-engineering
      permission: maintain
    - team: release-engineering
      permission: pull
    - team: security
      permission: pull
  direct_collaborators: []
