api_version: github.mindclade.io/v1
kind: Repository
metadata:
  id: github-config
  owner_team: security
spec:
  name: github-config
  description: Declarative GitHub organization governance control plane.
  visibility: private
  archived: false
  archive_on_destroy: true
  features:
    issues: true
    projects: false
    wiki: false
    discussions: false
    downloads: false
  merge_policy:
    allow_squash_merge: true
    allow_merge_commit: false
    allow_rebase_merge: false
    allow_auto_merge: true
    allow_update_branch: true
    delete_branch_on_merge: true
    squash_merge_commit_title: PR_TITLE
    squash_merge_commit_message: PR_BODY
  security:
    vulnerability_alerts: true
    dependabot_security_updates: true
    advanced_security: true
    secret_scanning: true
    secret_scanning_push_protection: true
  custom_properties:
    repository_class: governance-source
    owner_team: security
    criticality: critical
    data_classification: restricted
    lifecycle: active
    ci_profile: github-actions
    language_profile: go-opentofu
    production_authority: github-governance
  team_grants:
    - team: security
      permission: maintain
  direct_collaborators: []
