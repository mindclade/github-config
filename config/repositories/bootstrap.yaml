api_version: github.mindclade.io/v1
kind: Repository
metadata:
  id: bootstrap
  owner_team: security
spec:
  name: bootstrap
  description: Root trust, state, federation, signing, and recovery foundations.
  visibility: public
  actions_access_level: none
  archived: false
  archive_on_destroy: true
  features:
    issues: true
    projects: false
    wiki: false
    discussions: false
    downloads: false
  merge_policy:
    allow_squash_merge: true
    allow_merge_commit: false
    allow_rebase_merge: false
    allow_auto_merge: true
    allow_update_branch: true
    delete_branch_on_merge: true
    squash_merge_commit_title: PR_TITLE
    squash_merge_commit_message: PR_BODY
  security:
    vulnerability_alerts: true
    dependabot_security_updates: true
    advanced_security: true
    secret_scanning: true
    secret_scanning_push_protection: true
  custom_properties:
    repository_class: infrastructure-source
    owner_team: security
    criticality: critical
    data_classification: public
    lifecycle: active
    ci_profile: github-actions
    language_profile: opentofu
    production_authority: none
  team_grants:
    - team: security
      permission: maintain
    - team: platform-operations
      permission: maintain
  direct_collaborators: []
