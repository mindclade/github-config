api_version: github.mindclade.io/v1
kind: Repository
metadata:
  id: gitops
  owner_team: release-engineering
spec:
  name: gitops
  description: Desired cluster application state and promotion-by-digest authority.
  visibility: internal
  actions_access_level: none
  archived: false
  archive_on_destroy: true
  features:
    issues: true
    projects: false
    wiki: false
    discussions: false
    downloads: false
  merge_policy:
    allow_squash_merge: true
    allow_merge_commit: false
    allow_rebase_merge: false
    allow_auto_merge: true
    allow_update_branch: true
    delete_branch_on_merge: true
    squash_merge_commit_title: PR_TITLE
    squash_merge_commit_message: PR_BODY
  security:
    vulnerability_alerts: true
    dependabot_security_updates: true
    advanced_security: true
    secret_scanning: true
    secret_scanning_push_protection: true
  custom_properties:
    repository_class: deployment-source
    owner_team: release-engineering
    criticality: critical
    data_classification: confidential
    lifecycle: active
    ci_profile: github-actions
    language_profile: yaml-kustomize
    production_authority: production-deployment
  team_grants:
    - team: release-engineering
      permission: maintain
    - team: developer-platform
      permission: maintain
  direct_collaborators: []
