api_version: github.mindclade.io/v1
kind: Organization
metadata:
  id: mindclade-organization
  owner_team: security
spec:
  estate_profile: github-enterprise-cloud-mixed
  founder_bootstrap_exception:
    id: FBE-0001
    state: UNUSED
    scope: founder-bootstrap-only
    workflow_ref: mindclade/github-config/.github/workflows/protected-apply.yml@refs/heads/main
    allowed_operations:
      - foundation-plan
      - foundation-apply
      - foundation-verification
    denied_operations:
      - adoption
      - enforcement
      - production-authority
      - exception-replay
    single_use_initial_state: UNUSED
    single_use_terminal_state: CONSUMED
    receipt_required: true
    receipt_digest_algorithm: sha256
    principal_id: founder-primary
    github_actor_accounts:
      - mindclade-founder
      - robpearc
    minimum_distinct_actor_accounts: 2
    independent_principals: false
    production_authority: false
    expires_at: "2026-09-30T23:59:59Z"
  founder_pull_request_bypass:
    contract: founder-pr-bypass.v1
    entitlement_id: founder-pr-bypass
    team: founder-pr-bypass
    principal_id: founder-primary
    github_actor_accounts:
      - mindclade-founder
      - robpearc
    durable: true
    bypass_mode: pull_request
    self_authored_pull_requests: true
    all_repositories: true
    all_paths: true
    label: founder-bypass
    comment_marker: "<!-- founder-pr-bypass:v1 -->"
    head_sha_required: true
    reason_required: true
    author_must_map_to_principal: true
    foundation_authority: false
    production_authority: false
    fbe_exception_id: FBE-0001
    activation:
      state: blocked
      blockers:
        - github-enterprise-cloud-not-qualified
        - required-workflow-evidence-not-qualified
  organization_login: mindclade
  default_repository_permission: none
  members_can_create_repositories: false
  members_can_create_public_repositories: false
  members_can_create_private_repositories: false
  members_can_create_internal_repositories: false
  members_can_create_pages: false
  members_can_fork_private_repositories: false
  web_commit_signoff_required: true
  two_factor_requirement: true
  installation_inventory_qualification:
    state: blocked
    authority: bootstrap
    blockers: [bootstrap-app-inventory-attestation-not-issued]
  custom_property_migration:
    phase: preserve
    legacy_allowed_values:
      owner_team: [platform]
      ci_profile: [none]
      production_authority: [enterprise-control]
  custom_properties:
    - name: repository_class
      value_type: single_select
      required: true
      values_editable_by: org_actors
      allowed_values:
        - application-source
        - deployment-source
        - governance-source
        - infrastructure-source
    - name: owner_team
      value_type: single_select
      required: true
      values_editable_by: org_actors
      allowed_values:
        - architecture
        - biological-safety
        - computational-biology
        - data-platform
        - developer-platform
        - ml-systems
        - platform-operations
        - product-engineering
        - release-engineering
        - security
    - name: criticality
      value_type: single_select
      required: true
      values_editable_by: org_actors
      allowed_values: [low, medium, high, critical]
    - name: data_classification
      value_type: single_select
      required: true
      values_editable_by: org_actors
      allowed_values: [public, internal, confidential, restricted]
    - name: lifecycle
      value_type: single_select
      required: true
      values_editable_by: org_actors
      allowed_values: [active, maintenance, deprecated, archived]
    - name: ci_profile
      value_type: single_select
      required: true
      values_editable_by: org_actors
      allowed_values: [github-actions, buildkite]
    - name: language_profile
      value_type: single_select
      required: true
      values_editable_by: org_actors
      allowed_values:
        - workflow-yaml
        - go-opentofu
        - opentofu
        - yaml-kustomize
        - polyglot
    - name: production_authority
      value_type: single_select
      required: true
      values_editable_by: org_actors
      allowed_values:
        - none
        - reusable-workflows
        - github-governance
        - root-trust
        - cloud-infrastructure
        - production-deployment
        - signed-artifacts
